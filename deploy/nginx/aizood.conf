# nginx site for the Zood Gamers home page: /etc/nginx/sites-available/aizood
# A static page from /var/www/aizood. certbot (--nginx) adds HTTPS and the
# http -> https redirect to this file.

server {
    listen 80;
    listen [::]:80;
    server_name aizood.ir;

    root /var/www/aizood;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
