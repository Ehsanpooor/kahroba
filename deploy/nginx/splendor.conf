# nginx site for the Splendor server: /etc/nginx/sites-available/splendor
# The download page from /var/www/splendor; the game server's API and
# realtime socket from Nakama on 127.0.0.1:7450; the private admin page at
# /admin/. certbot (--nginx) adds HTTPS and the http -> https redirect to this
# file; deploy.sh installs it again (and has certbot put HTTPS back) only when
# this copy has changed.
# ($connection_upgrade is defined once for the whole server, in the veinora
# site; defining the map again here would stop nginx from loading.)

server {
    listen 80;
    listen [::]:80;
    # splendor.aizood.ir; the first address stays for the apps installed before 0.9.3
    server_name splendor.mspink.ir splendor.aizood.ir;

    root /var/www/splendor;
    index index.html;

    # the game server: its HTTP API and health check
    location /v2/ {
        proxy_pass http://127.0.0.1:7450;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
    location = /healthcheck {
        proxy_pass http://127.0.0.1:7450;
    }

    # the realtime socket (a game can last half an hour or more)
    location /ws {
        proxy_pass http://127.0.0.1:7450;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # the page is never cached, so testers always see the newest build
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ =404;
    }

    # the private admin page (deploy/admin), behind a password: user "admin",
    # the password is ADMIN_PASSWORD in /opt/splendor/.env (deploy.sh)
    location = /admin {
        absolute_redirect off;
        return 301 /admin/;
    }
    location /admin/ {
        alias /var/www/splendor-admin/;
        index index.html;
        auth_basic "Splendor admin";
        auth_basic_user_file /etc/nginx/splendor-admin.htpasswd;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow";
    }
    # its data: /admin/api/<rpc> is the server's admin_* RPC, called with the
    # runtime http key. The key is set by the included file (written by
    # deploy.sh from the server's .env), so it never reaches the browser.
    location ~ ^/admin/api/(?<admin_rpc>admin_[a-z_]+)$ {
        auth_basic "Splendor admin";
        auth_basic_user_file /etc/nginx/splendor-admin.htpasswd;
        include /etc/nginx/splendor-admin-key.conf;
        # the browser's password must not reach Nakama, which would read a
        # Basic header as the http key and refuse the call
        proxy_set_header Authorization "";
        proxy_set_header Content-Type application/json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
        add_header Cache-Control "no-store";
        proxy_pass http://127.0.0.1:7450/v2/rpc/$admin_rpc?http_key=$splendor_admin_key&unwrap;
    }

    # the Android app for testers: served as an Android package, never cached
    location ^~ /download/ {
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
